[project]
name = "primesw"
version = "2.0.2"
description = "Probabilistic Regressor for Input to the Magnetosphere Estimation (Solar Wind)"
authors = [{name = "Connor OBrien", email = "obrienco@bu.edu"}]
license = {text = "GPL-3.0"}
readme = "README.md"
classifiers=[
      'Development Status :: 5 - Production/Stable',
      'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
      'Programming Language :: Python :: 3.12',
      'Topic :: Scientific/Engineering :: Physics',
      'Topic :: Scientific/Engineering :: Astronomy',
      'Topic :: Scientific/Engineering :: Atmospheric Science'
]

requires-python = ">=3.8,<3.13"
dependencies = [
      "lightning (>=2.5,<2.6)",
      "matplotlib>=3.4",
      "pandas (<3.0)",
      "numpy (>=1.20.3,<2.0.0)",
      "scipy>=1.6",
      "protobuf==3.20.0",
      "tables (<4.0.0)",
      "cdasws (>=1.8.9,<2.0.0)",
      "xarray (>=2024.1.0,<2026.0.0)",
      "cdflib (>=1.3.2,<2.0.0)",
      "loguru<1.0.0",
      "omegaconf>=2.0.0",
]

[tool.poetry]
include = ["primesw"]

[project.urls]
Homepage = "https://primesw.readthedocs.io/en/latest/"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
