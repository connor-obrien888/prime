log_level: DEBUG
#Logs and experiments
experiments:
  checkpoint: "/glade/u/home/cobrien/data/prime/checkpoints"
  trainer:
    accelerator: gpu # "cpu", "mps", "auto"
    devices: [0] # "auto", 1, [0, 2], etc
    strategy: auto # multi-gpu: ddp_find_unused_parameters_true, single-gpu: "auto"
    precision: 32 # "16-mixed", "32-true", "32-float", "16-mixed", etc
    profiler: simple # options are 'XLAProfiler' (TPU), 'PyTorchProfiler', warning: PyTorchProfiler only works on cpu/gpu according to docs
    max_epochs: 300 # number of epochs to train for
    log_every_n_steps: 10
    check_val_every_n_epoch: 1
    detect_anomaly: False
    limit_train_batches: 1.0  #0.05
    limit_val_batches: 1.0
    limit_test_batches: 1
    limit_predict_batches: 1
    gradient_clip_val: 10
    gradient_clip_algorithm: value
    tensorboard_path: "/glade/u/home/cobrien/data/prime/tensorboard_logs"
#Dataset configuration
data:
  scaler_type: 'IQR' # Scaler to use for input and target data. Options: interquartile range (IQR), standard deviation (STD), minmax (MINMAX, not implemented)
  target_features: ['N', 'temp'] #, 'Vx', 'Vy', 'Vz', 'Bx', 'By', 'Bz'] # Geotail
  # target_feature: ['T_i', 'T_e', 'T_i_over_T_e'] # MMS
  input_features: ['Ni', 'Vi_xgse', 'Vi_ygse', 'Vi_zgse', 'Vth', 'R_xgse', 'R_ygse', 'R_zgse', 'B_xgsm', 'B_ygsm', 'B_zgsm', 'SME', 'SMR', 'tilt']
  position_features: ['Rx_int', 'Ry_int', 'Rz_int'] # Geotail
  # position_features: ['r_gsm_x', 'r_gsm_y', 'r_gsm_z'] # MMS
  interp_flags: ['flag']
  region: 'magnetotail'
  cadence: '100s'
  interpolate: True
  window: 200
  stride: 0
  interp_frac: 0.10
  # trn_bounds: ['19940216 06:03:00+0000', '20061230 16:19:00+0000'] # Bounds for geotail data resulting in 60/20/20 split
  # val_bounds: ['20061230 16:20:00+0000', '20150822 02:54:00+0000']
  # tst_bounds: ['20150822 02:55:00+0000', '20221125 19:51:00+0000']
  trn_bounds: ['1994-11-30 18:00:00+0000', '2005-01-01 00:00:00+0000'] # Bounds for geotail data with the same test set as TM03
  val_bounds: ['2010-01-01 00:00:00+0000', '2022-11-10 00:00:00+0000']
  tst_bounds: ['2005-01-01 00:00:00+0000', '2010-01-01 00:00:00+0000']
  # trn_bounds: ['20170502 09:41:00+0000', '20180922 11:56:00+0000'] # Bounds for MMS data resulting in 60/20/20 split
  # val_bounds: ['20180922 11:58:00+0000', '20190912 23:33:00+0000']
  # tst_bounds: ['20190912 23:34:00+0000', '20210626 23:59:00+0000']
  datastore: "/glade/u/home/cobrien/data/magnetotail/resampled_datasets.h5"
  in_key: "wind_full"
  tar_key: "geotail_stricthighdensity_100s" # 'mms_temperatures_proc_v2_100s'
  cuts: [] # ['density_despike_20']
# Model configuration
model: 
  decoder_type: 'prob_linear'
  encoder_type: 'rnn'
  decoder_hidden_layers: [256, 128, 64]
  encoder_hidden_dim: 256
  encoder_num_layers: 2
  p_drop: 0.2
  pos_encoding_size: 4

# Optimization configuration
opt:
  loss: 'crps'
  optimizer: 'adam' 
  lr: 1e-5
  lr_scheduler: const
  patience: 10
  factor: 1
  weight_decay: 0
  total_iters: 40 # Used for some LR schedulers (e.g. linear)
  batch_size: 4096 # Optimal batch size for one Derecho GPU
  num_workers: 127